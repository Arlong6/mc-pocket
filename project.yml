name: MCPocket
options:
  bundleIdPrefix: com.arlong
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  MCPocket:
    type: application
    platform: iOS
    sources:
      - path: Sources/MCPocket
      - path: Sources/Shared
    resources:
      - path: Resources/Assets.xcassets
    dependencies:
      - target: MCPocketWidgets
      - target: MCPocketWatch
        embed: true
    info:
      path: Sources/MCPocket/Info.plist
      properties:
        CFBundleDisplayName: MC Pocket
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "Scan the pairing QR code shown by Mission Control on your Mac."
        NSLocalNetworkUsageDescription: "Connect to Mission Control running on your Mac over your local network (or Tailscale)."
        UIBackgroundModes:
          - remote-notification
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.arlong.mcpocket.pairing
            CFBundleURLSchemes:
              - mcpocket
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arlong.mcpocket
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO

  MCPocketWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/MCPocketWidgets
      - path: Sources/Shared
    info:
      path: Sources/MCPocketWidgets/Info.plist
      properties:
        CFBundleDisplayName: MC Pocket Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arlong.mcpocket.widgets
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO
        SKIP_INSTALL: YES

  MCPocketWatch:
    type: application
    platform: watchOS
    sources:
      - path: Sources/MCPocketWatch
      - path: Sources/Shared
        excludes:
          - "WaitingActivityAttributes.swift"
    info:
      path: Sources/MCPocketWatch/Info.plist
      properties:
        CFBundleDisplayName: MC Pocket
        WKApplication: true
        WKWatchOnly: false
        WKCompanionAppBundleIdentifier: com.arlong.mcpocket
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arlong.mcpocket.watchkitapp
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        TARGETED_DEVICE_FAMILY: "4"
        SUPPORTED_PLATFORMS: "watchsimulator watchos"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO
        SKIP_INSTALL: NO
